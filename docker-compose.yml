version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fefushop_backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    environment:
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      # SECRET_KEY must be set via environment variable or .env file
      # For development, generate one using:
      # python -c 'from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())'
    volumes:
      - ./backend:/app
      - backend_media:/app/media
      - backend_static:/app/staticfiles
    networks:
      - fefushop_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fefushop_frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000/api
      NODE_ENV: development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - fefushop_network

volumes:
  backend_media:
  backend_static:

networks:
  fefushop_network:
    driver: bridge
